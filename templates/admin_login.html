<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Key Management - Mini PKI</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg-a: #0b0c10;
      --bg-b: #18101e;
      --sun-1: #ff8a00;
      --sun-2: #ff4ec0;
      --glass: rgba(255,255,255,0.03);
      --glass-border: rgba(255,78,192,0.10);
      --text: #f4f7fb;
      --muted: #d7ccd9;
      --ok: #baf0d4;
    }
    html,body{height:100%; margin:0; font-family:"Inter",system-ui,-apple-system,Segoe UI,Roboto,Arial;}
    body{
      background: linear-gradient(160deg, var(--bg-a) 0%, var(--bg-b) 100%);
      color: var(--text);
      padding:28px;
    }

    .container{ max-width:1100px; margin:0 auto; }

    h2{
      text-align:center;
      color:#ffd6a8;
      font-weight:700;
      margin-bottom:18px;
      text-shadow:0 8px 28px rgba(255,78,192,0.04);
    }

    .glass{
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border:1px solid var(--glass-border);
      border-radius:16px;
      padding:22px;
      box-shadow: 0 18px 50px rgba(255,78,192,0.04);
      backdrop-filter: blur(8px) saturate(1.05);
    }

    table{ width:100%; border-radius:12px; overflow:hidden; }
    thead th{
      background: linear-gradient(90deg, rgba(255,138,0,0.06), rgba(255,78,192,0.05));
      color:#fff3e6; font-weight:700; padding:12px 14px; border:none;
    }
    tbody td{ padding:12px 14px; color:var(--muted); background: linear-gradient(180deg, rgba(0,0,0,0.02), rgba(255,255,255,0.01)); }
    tbody tr:hover{ transform: translateY(-6px); background: linear-gradient(90deg, rgba(255,78,192,0.03), rgba(255,138,0,0.02)); box-shadow: 0 14px 40px rgba(255,78,192,0.03); transition:0.18s; }

    .btn-export{ background: linear-gradient(90deg,#bfeccf,#98e0b2); color:#071014; border:none; border-radius:8px; padding:6px 10px; font-weight:700; box-shadow: 0 10px 30px rgba(74,222,128,0.06); }
    .btn-view{ background: linear-gradient(90deg,#ffd18a,#ffb36a); color:#2b1b12; border:none; border-radius:8px; padding:6px 10px; font-weight:700; box-shadow: 0 10px 30px rgba(255,138,0,0.06); }
    .btn-delete{ background: linear-gradient(90deg,#ff7a9b,#ff5ab0); color:#1b0b12; border:none; border-radius:8px; padding:6px 10px; font-weight:700; box-shadow: 0 10px 30px rgba(255,78,192,0.06); }

    .btn-outline-info{ border:2px solid transparent; color:#ffd6a8; font-weight:700; border-radius:36px; padding:10px 18px; transition:0.25s; background: linear-gradient(90deg, rgba(255,138,0,0.06), rgba(255,78,192,0.04)); }
    .btn-outline-info:hover{ background: linear-gradient(90deg,#ff8a00,#ff4ec0); color:#0b0c10; transform:translateY(-3px); box-shadow: 0 18px 48px rgba(255,78,192,0.10); }

    @media(max-width:760px){ body{padding:18px} .glass{padding:16px} }
  </style>
</head>
<body>
  <div class="container">
    <h2 class="text-center mb-4">🗝️ Key Management</h2>

    <div class="glass">
      <table class="table">
        <thead>
          <tr>
            <th>User</th>
            <th>Key File</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          {% for key in key_data %}
          <tr>
            <td>{{ key.username }}</td>
            <td>{{ key.key_name }}</td>
            <td>
              <a href="{{ url_for('download_key', username=key.username, key_name=key.key_name) }}" class="btn btn-sm btn-export" download>Download</a>
              <a href="{{ url_for('view_key', username=key.username, key_name=key.key_name) }}" class="btn btn-sm btn-view">View</a>
              <a href="{{ url_for('delete_key', username=key.username, key_name=key.key_name) }}" class="btn btn-sm btn-delete" onclick="return confirm('Delete key for {{ key.username }}?')">Delete</a>
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>

      <a href="{{ url_for('admin_dashboard') }}" class="btn btn-outline-info mt-3">← Back to Dashboard</a>
    </div>
  </div>
</body>
</html>
