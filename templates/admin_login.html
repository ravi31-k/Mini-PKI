<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Login - Mini PKI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #0b0916;
      color: #ffb7ef;
      font-family: 'Courier New', monospace;
    }

    .login-box {
      max-width: 400px;
      margin: 100px auto;
      background: rgba(255, 0, 128, 0.07);
      padding: 30px;
      border-radius: 14px;
      border: 1px solid rgba(255, 0, 157, 0.4);
      box-shadow: 0 0 20px rgba(255, 0, 128, 0.25);
    }

    .login-title {
      text-align: center;
      margin-bottom: 25px;
      color: #ff4db3;
      text-shadow: 0 0 12px #ff0080;
    }

    .form-control {
      background-color: #150b1d;
      border: 1px solid #ff008022;
      color: #ff4db3;
    }

    .form-control:focus {
      background-color: #150b1d;
      border-color: #ff0080;
      box-shadow: 0 0 8px #ff008055;
      color: #ffb7ef;
    }

    .btn-login {
      width: 100%;
      background-color: #ff0080;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: bold;
      transition: 0.2s;
      box-shadow: 0 0 10px #ff008055;
    }

    .btn-login:hover {
      background-color: #ff4db3;
      box-shadow: 0 0 15px #ff0080;
      transform: scale(1.03);
    }

    .error-msg {
      color: #ff4f8a;
      font-size: 0.95rem;
      margin-top: 10px;
      text-shadow: 0 0 6px #ff1f7a;
    }

    .back-link {
      display: block;
      margin-top: 20px;
      text-align: center;
      color: #ff79c6;
      text-decoration: none;
      transition: 0.2s;
    }

    .back-link:hover {
      color: #ff4db3;
      text-shadow: 0 0 10px #ff0080;
      transform: scale(1.05);
    }

    /* Tooltip on hover */
    .form-label {
      position: relative;
      color: #ffb7ef;
    }

    .form-label:hover::after {
      content: attr(data-hint);
      position: absolute;
      top: -20px;
      left: 0;
      background-color: #2a0035;
      color: #ffb7ef;
      padding: 4px 7px;
      border-radius: 4px;
      font-size: 0.75rem;
      opacity: 0.9;
      border: 1px solid #ff008099;
      box-shadow: 0 0 6px #ff0080;
    }
  </style>
</head>

<body>

  <div class="login-box">
    <h3 class="login-title">🔐 Admin Login</h3>

    <form method="POST">
      <div class="mb-3">
        <label for="username" class="form-label" data-hint="admin">Username</label>
        <input type="text" name="username" id="username" class="form-control" required>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label" data-hint="admin123">Password</label>
        <input type="password" name="password" id="password" class="form-control" required>
      </div>

      {% if error %}
      <div class="error-msg">{{ error }}</div>
      {% endif %}

      <button type="submit" class="btn btn-login mt-3">Login</button>
    </form>

    <a href="{{ url_for('home') }}" class="back-link">← Back to Home</a>
  </div>

</body>
</html>
