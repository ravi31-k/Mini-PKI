<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Generate CSR - Mini PKI</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(140deg, #0d0b1a, #2a0f2f);
      font-family: 'Share Tech Mono', monospace;
      color: #ff2d95;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-shadow: 0 0 6px #ff2d95aa;
    }

    .container-card {
      max-width: 650px;
      width: 100%;
      background: rgba(30, 10, 30, 0.55);
      border: 1px solid #a259ff55;
      border-radius: 18px;
      box-shadow: 0 0 25px #a259ff44;
      padding: 40px;
      backdrop-filter: blur(6px);
      transition: 0.3s ease;
    }

    .container-card:hover {
      box-shadow: 0 0 35px #ff2d9577;
      transform: translateY(-3px);
    }

    .page-title {
      font-size: 2.1rem;
      font-family: 'Orbitron', sans-serif;
      color: #ff2d95;
      text-shadow: 0 0 15px #ff2d95, 0 0 25px #a259ff;
      text-align: center;
      margin-bottom: 30px;
    }

    .form-label {
      color: #ff914d;
      font-size: 1rem;
      letter-spacing: 1px;
    }

    .form-control {
      background-color: #1a0f1f;
      border: 1px solid #a259ff88;
      color: #ff2d95;
      border-radius: 10px;
      box-shadow: 0 0 6px #a259ff33 inset;
    }

    .form-control::placeholder {
      color: #d47affaa;
    }

    .form-control:focus {
      background-color: #1a0f1f;
      border-color: #ff2d95;
      box-shadow: 0 0 12px #ff2d95aa;
      color: #ff2d95;
    }

    .btn-custom {
      background-color: transparent;
      border: 1px solid #a259ff;
      color: #a259ff;
      box-shadow: 0 0 10px #a259ff55;
      padding: 12px;
      font-weight: bold;
      border-radius: 12px;
      transition: 0.3s ease;
      font-size: 1rem;
    }

    .btn-custom:hover {
      background-color: #ff914d;
      border-color: #ff914d;
      color: #120614;
      box-shadow: 0 0 18px #ff914d;
    }

    .btn-back {
      border-radius: 12px;
      border: 1px solid #ff2d95;
      color: #ff2d95;
      background-color: transparent;
      padding: 10px 20px;
      transition: 0.3s;
      box-shadow: 0 0 10px #ff2d9555;
    }

    .btn-back:hover {
      background-color: #ff2d95;
      color: #1a0f1f;
      box-shadow: 0 0 18px #ff2d95;
    }

    .alert {
      background-color: rgba(255, 45, 149, 0.05);
      border-left: 5px solid #ff2d95;
      border-radius: 8px;
      color: #ffb6d7;
      box-shadow: 0 0 12px #ff2d9544;
    }
  </style>
</head>

<body>
  <div class="container container-card">
    <h2 class="page-title">🔐 Generate CSR & Private Key</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} alert-dismissible fade show">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form action="{{ url_for('register') }}" method="post">
      <div class="mb-3">
        <label for="name" class="form-label">Full Name</label>
        <input type="text" class="form-control" id="name" name="name" placeholder="e.g., Alice Cyber" required />
      </div>
      <button type="submit" class="btn btn-custom w-100">🚀 Generate CSR</button>
    </form>

    <div class="text-center mt-4">
      <a href="{{ url_for('home') }}" class="btn btn-back">⬅ Back to Home</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
