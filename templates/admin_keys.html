<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Key Management - Mini PKI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #0d0c1d; /* Dark cyberpunk background */
      color: #ffb7ef;
      font-family: 'Courier New', monospace;
    }

    .container {
      margin-top: 50px;
    }

    .glass {
      background: rgba(255, 0, 128, 0.08);
      border: 1px solid rgba(255, 0, 157, 0.4);
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0 0 18px rgba(255, 0, 157, 0.25);
    }

    .table-dark {
      background-color: rgba(25, 0, 36, 0.7) !important;
    }

    .table th {
      color: #ff79c6;
      font-size: 1rem;
      text-shadow: 0 0 6px rgba(255, 0, 128, 0.7);
    }

    .table-striped tbody tr:nth-of-type(odd) {
      background-color: rgba(255, 0, 128, 0.08) !important;
    }

    .btn-export {
      background-color: #ff0080;
      border: none;
      color: white;
      transition: 0.2s;
    }
    .btn-export:hover {
      background-color: #ff4db3;
      transform: scale(1.05);
      box-shadow: 0 0 8px #ff0080;
    }

    .btn-view {
      background-color: #8e00ff;
      border: none;
      color: white;
      transition: 0.2s;
    }
    .btn-view:hover {
      background-color: #c044ff;
      transform: scale(1.05);
      box-shadow: 0 0 8px #8e00ff;
    }

    .btn-delete {
      background-color: #e91e63;
      color: white;
      border: none;
      transition: 0.2s;
    }
    .btn-delete:hover {
      background-color: #ff4f8a;
      transform: scale(1.05);
      box-shadow: 0 0 8px #e91e63;
    }

    .btn-outline-info {
      border-color: #ff0080 !important;
      color: #ff4db3 !important;
      transition: 0.2s;
    }
    .btn-outline-info:hover {
      background-color: #ff0080;
      color: #0d0c1d !important;
      box-shadow: 0 0 10px #ff0080;
      transform: scale(1.07);
    }
  </style>

</head>
<body>

<div class="container">
  <h2 class="text-center mb-4" style="color:#ff4db3; text-shadow:0 0 10px #ff0080;">
    🗝️ Key Management
  </h2>

  <div class="glass">

    <table class="table table-dark table-striped">
      <thead>
        <tr>
          <th>User</th>
          <th>Key File</th>
          <th>Actions</th>
        </tr>
      </thead>

      <tbody>
        {% for key in key_data %}
        <tr>
          <td>{{ key.username }}</td>
          <td>{{ key.key_name }}</td>
          <td>
            <a href="{{ url_for('download_key', username=key.username, key_name=key.key_name) }}"
               class="btn btn-sm btn-export" download>Download</a>

            <a href="{{ url_for('view_key', username=key.username, key_name=key.key_name) }}"
               class="btn btn-sm btn-view">View</a>

            <a href="{{ url_for('delete_key', username=key.username, key_name=key.key_name) }}"
               class="btn btn-sm btn-delete"
               onclick="return confirm('Delete key for {{ key.username }}?')">
               Delete
            </a>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>

    <a href="{{ url_for('admin_dashboard') }}" class="btn btn-outline-info mt-3">← Back to Dashboard</a>

  </div>
</div>

</body>
</html>
