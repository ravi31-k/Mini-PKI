<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Validate Certificate - Mini PKI</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(140deg, #0d0b1a, #2a0f2f);
      font-family: 'Share Tech Mono', monospace;
      color: #ff2d95;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-shadow: 0 0 6px #ff2d95aa;
    }

    .card-box {
      width: 650px;
      background: rgba(20, 10, 25, 0.5);
      padding: 40px;
      border-radius: 18px;
      border: 1px solid #ff2d9555;
      box-shadow: 0 0 25px #ff2d9555;
      backdrop-filter: blur(6px);
      transition: 0.3s;
    }

    .card-box:hover {
      box-shadow: 0 0 35px #ff2d9577;
      transform: translateY(-3px);
    }

    .title {
      font-family: 'Orbitron', sans-serif;
      font-size: 2rem;
      color: #ff2d95;
      text-align: center;
      text-shadow: 0 0 18px #ff2d95, 0 0 25px #a259ff;
      margin-bottom: 30px;
    }

    .form-label {
      color: #ff914d;
      letter-spacing: .5px;
    }

    .form-control {
      background: #1a0f1f;
      border: 1px solid #a259ff88;
      color: #ff2d95;
      border-radius: 10px;
      box-shadow: 0 0 6px #a259ff33 inset;
    }

    .form-control:focus {
      border-color: #ff2d95;
      color: #ff2d95;
      box-shadow: 0 0 12px #ff2d95aa;
    }

    .btn-custom {
      border: 1px solid #a259ff;
      color: #a259ff;
      padding: 12px;
      width: 100%;
      border-radius: 10px;
      font-weight: bold;
      transition: 0.3s ease;
      box-shadow: 0 0 10px #a259ff66;
    }

    .btn-custom:hover {
      background: #ff914d;
      border-color: #ff914d;
      color: #120614;
      box-shadow: 0 0 18px #ff914d;
    }

    .alert {
      background: rgba(255, 45, 149, 0.1);
      border-left: 5px solid #ff2d95;
      color: #ffcbe4;
      box-shadow: 0 0 12px #ff2d9555;
    }
  </style>
</head>

<body>
  <div class="card-box">
    <h2 class="title">🔍 Validate Certificate</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} alert-dismissible fade show">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form action="{{ url_for('validate') }}" method="post">
      <div class="mb-3">
        <label class="form-label">Certificate Serial Number</label>
        <input type="text" class="form-control" name="serial" placeholder="Enter serial number" required>
      </div>

      <button type="submit" class="btn-custom">Validate</button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
